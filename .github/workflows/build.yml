name: App bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Derselbe Signaturschlüssel wie auf dem Laptop – sonst lässt Android das Update nicht zu.
      - name: Signaturschlüssel einrichten
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::Secret DEBUG_KEYSTORE fehlt (siehe README, Abschnitt Updates ohne Kabel)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: APK bauen
        run: |
          VC=$(( $(date +%s) / 60 ))
          echo "VC=$VC" >> "$GITHUB_ENV"
          gradle assembleRelease --no-daemon -PversionCode=$VC -PupdateRepo=${{ github.repository }}
          cp app/build/outputs/apk/release/app-release.apk PdfLeser.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VC }}
          name: PDF Leser – Build ${{ env.VC }}
          body: ${{ github.event.head_commit.message }}
          files: PdfLeser.apk
